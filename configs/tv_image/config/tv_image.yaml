include:
  file: trixie-minbase.yaml

device:
  layer: rpi5
  hostname: tv-host
  user1: tv-user

image:
  name: mytvimage


layer:
  app: tv-kiosk

tv_kiosk:
  #url: "https://youtube.com"      # or a file in the image: /var/www/html/tv_menu.html
  url: /var/www/html/tv_menu.html
  user: tv-kiosk
  rotation: 90                     # 0, 90, 180 or 270 (270 if 90 turns the wrong way)
# Wifi
iwd:
  profile: ${@SRCROOT}/VM8428755.psk
ieee80211:
  regdom: GB

#SSH
ssh:
  pubkey_user1: ${@SRCROOT}/ssh.pub
  pubkey_only: y