# Starting configuration. Frigate needs at least one camera to start, so this is a
# disabled placeholder: copy it, fill in the real stream, and remove `enabled: false`.
#
# To keep a camera password out of this file, put the name FRIGATE_RTSP_PASSWORD in curly
# braces in the URL and set FRIGATE_RTSP_PASSWORD=... in environment/ha.env. Frigate will not
# start if the config names a FRIGATE_ variable that is not set, even in a disabled
# camera, so the placeholder below does not use one.
mqtt:
  host: mosquitto

detectors:
  cpu1:
    type: cpu

cameras:
  placeholder:
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://user:password@192.168.1.10:554/stream
          roles:
            - detect
            - record
    detect:
      width: 1280
      height: 720
