# Starting configuration. Frigate needs at least one camera to start, so this is a
# disabled placeholder: copy it, fill in the real stream, and remove `enabled: false`.
# {FRIGATE_RTSP_PASSWORD} is filled from the environment (set it in ~/app/.env).
mqtt:
  host: mosquitto

detectors:
  cpu1:
    type: cpu

cameras:
  placeholder:
    enabled: false
    ffmpeg:
      inputs:
        - path: rtsp://user:{FRIGATE_RTSP_PASSWORD}@192.168.1.10:554/stream
          roles:
            - detect
            - record
    detect:
      width: 1280
      height: 720
