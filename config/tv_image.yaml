include:
  file: trixie-minbase.yaml

device:
  layer: rpi5
  hostname: tv-host
  user1: tv-user

image:
  name: mytvimage
  root_part_size: 150%   # was 300% (inherited). Small on purpose: growfs fills the card on first boot


layer:
  app: kiosk
  growfs: growfs

kiosk:
  #url: "https://youtube.com"      # a web page instead of the local one below
  page: ${@SRCROOT}/resources/tv_menu.html
  user: tv-kiosk
  rotation: 90                     # 0, 90, 180 or 270 (270 if 90 turns the wrong way)
# Wifi
iwd:
  profile: ${@SRCROOT}/environment/VM8428755.psk
ieee80211:
  regdom: GB

#SSH
ssh:
  pubkey_user1: ${@SRCROOT}/environment/ssh.pub
  pubkey_only: y