include:
  file: trixie-minbase.yaml

device:
  layer: rpi5
  hostname: runner
  user1: github-runner
  user1sudo: nopasswd             # the runner runs as user1, so jobs get passwordless sudo

image:
  name: build_host
  root_part_size: 150%   # was 300% (inherited). Small on purpose: growfs fills the card on first boot


layer:
  app: kiosk
  growfs: growfs
  runner: git-runner
  runnerlogs: runner-logs          # step output and logs for the kiosk page
  builder: rpi_builder

kiosk:
  page: ${@SRCROOT}/resources/runner-kiosk.html
  user: runner-kiosk
  rotation: 90                     # 0, 90, 180 or 270 (270 if 90 turns the wrong way)

runner:
  repo: https://github.com/ConnorHall938/Pi_images
  user: github-runner              # user1, for its passwordless sudo

# Secrets are not built in. ./build.py flash copies these from environment/ onto the
# card's boot partition, and the bootenv layer moves them into place on first boot:
# the Wi-Fi profile, the runner's token, and kiosk.env (GITHUB_REPO and GITHUB_TOKEN
# for the page).
bootenv:
  files: VM8428755.psk git-runner.token kiosk.env

# Wifi (the profile comes from the boot partition, above)
ieee80211:
  regdom: GB

#SSH
ssh:
  pubkey_user1: ${@SRCROOT}/environment/ssh.pub
  pubkey_only: y
