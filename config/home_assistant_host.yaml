include:
  file: trixie-minbase.yaml

device:
  layer: rpi5
  hostname: ha-host
  user1: ha

image:
  name: homeassistant
  root_part_size: 150%   # was 300% (inherited). Small on purpose: growfs fills the card on first boot


layer:
  kiosk: kiosk
  containers: docker
  growfs: growfs

kiosk:
  url: http://localhost:8123        # Home Assistant, from the docker stack
  user: ha-kiosk
  rotation: 90                     # 0, 90, 180 or 270 (270 if 90 turns the wrong way)
docker:
  user: ha
  compose: ${@SRCROOT}/resources/ha_config/compose.yaml
  files: ${@SRCROOT}/resources/ha_config/files   # copied into ~/app/, so ./config:/config in the compose file finds files/config/
  envfile: ${@SRCROOT}/environment/ha.env        # installed as ~/app/.env: camera passwords etc, never committed
# Wifi
iwd:
  profile: ${@SRCROOT}/environment/VM8428755.psk
ieee80211:
  regdom: GB

#SSH
ssh:
  pubkey_user1: ${@SRCROOT}/environment/ssh.pub
  pubkey_only: y