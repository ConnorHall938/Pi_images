include:
  file: trixie-minbase.yaml

device:
  layer: rpi5
  hostname: ha-host
  user1: ha

image:
  name: homeassistant
  root_part_size: 150%   # was 300% (inherited). Small on purpose: growfs fills the card on first boot


layer:
  containers: docker
  growfs: growfs

docker:
  user: ha
  compose: ${@SRCROOT}/resources/ha_config/compose.yaml
  files: ${@SRCROOT}/resources/ha_config/files   # copied into ~/app/, so ./config:/config in the compose file finds files/config/
  envfile: ha.env        # from the boot partition (see bootenv), installed as ~/app/.env: camera passwords etc
# Secrets are not built in. ./build.py flash copies these from environment/ onto the
# card's boot partition, and the bootenv layer moves them into place on first boot.
bootenv:
  files: VM8428755.psk ha.env

# Wifi (the profile comes from the boot partition, above)
ieee80211:
  regdom: GB

#SSH
ssh:
  pubkey_user1: ${@SRCROOT}/environment/ssh.pub
  pubkey_only: y
