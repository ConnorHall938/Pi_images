# METABEGIN
# X-Env-Layer-Name: kiosk
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Category: example
# X-Env-Layer-Desc: Example webkiosk layer showing how to define configuration
#  variables, declare packages and create a start up script. We depend on the
#  device-user-admin layer as we want to run the kiosk as the user it creates, and
#  we depend on systemd because we install a systemd service to start the kiosk.
# X-Env-Layer-Requires: device-user-admin,systemd-net-min,systemd-timesyncd
#
# X-Env-VarPrefix: kiosk
#
# X-Env-Var-assetdir: ${DOTD}
# X-Env-Var-assetdir-Required: n
# X-Env-Var-assetdir-Valid: dir
# X-Env-Var-assetdir-Set: y
#
# X-Env-Var-url: https://example.com
# X-Env-Var-url-Desc: What the kiosk loads at startup, an http:// or https:// URL
#  (eg http://localhost:8123 for a service on this device). The kiosk waits for
#  it to answer before opening the browser. Ignored when page is set. No spaces.
# X-Env-Var-url-Required: n
# X-Env-Var-url-Valid: regex:^https?://[a-zA-Z0-9.-]+[a-zA-Z0-9]/?[^ ]*$
# X-Env-Var-url-Set: y
#
# X-Env-Var-page:
# X-Env-Var-page-Desc: Absolute path to a file on the build host (eg a
#  file under the repo's resources/ folder) to install into the image, in
#  /usr/share/kiosk/, and load instead of url. No spaces in the path.
# X-Env-Var-page-Required: n
# X-Env-Var-page-Valid: regex:^(/[^ ]+)?$
# X-Env-Var-page-Set: y
#
# X-Env-Var-user: kiosk-user
# X-Env-Var-user-Desc: Account the kiosk runs as.
# X-Env-Var-user-Required: n
# X-Env-Var-user-Valid: regex:^[a-z_][a-z0-9_-]*$
# X-Env-Var-user-Set: y
#
# X-Env-Var-rotation: 0
# X-Env-Var-rotation-Desc: Rotate the kiosk display. One of 0, 90, 180 or 270,
#  passed to wlr-randr --transform on the first output before the browser starts.
#  If the picture turns the wrong way, use 270 instead of 90 (or the reverse).
# X-Env-Var-rotation-Required: n
# X-Env-Var-rotation-Valid: regex:^(0|90|180|270)$
# X-Env-Var-rotation-Set: y
#
# X-Env-Var-touch_matrix:
# X-Env-Var-touch_matrix-Desc: Six numbers, space separated, for libinput's
#  calibration matrix, applied to every touchscreen. The compositor rotates the
#  picture but not the touch input, so by default a matrix matching rotation is
#  used (none for 0). Set this only if touches land in the wrong place, eg
#  the opposite direction's matrix (eg "0 1 0 -1 0 1" for a 90 rotation). See
#  libinput's LIBINPUT_CALIBRATION_MATRIX.
# X-Env-Var-touch_matrix-Required: n
# X-Env-Var-touch_matrix-Valid: regex:^(-?[0-9.]+( -?[0-9.]+){5})?$
# X-Env-Var-touch_matrix-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - cage
    - chromium
    - curl
    - wlr-randr
  customize-hooks:
    - |
      for g in video render input; do
        chroot $1 groupadd -f -r $g
      done
      chroot $1 adduser --disabled-password --gecos "" "$IGconf_kiosk_user"
      for g in video render input; do
        chroot $1 adduser "$IGconf_kiosk_user" $g
      done
    - |
      # A page is a file from the config, copied into the image; otherwise load the URL
      if [ -n "${IGconf_kiosk_page:-}" ]; then
        [ -f "$IGconf_kiosk_page" ] || { echo "kiosk: page not found: $IGconf_kiosk_page" >&2; exit 1; }
        install -D -m 0644 "$IGconf_kiosk_page" "$1/usr/share/kiosk/$(basename "$IGconf_kiosk_page")"
        export KIOSK_URL="file:///usr/share/kiosk/$(basename "$IGconf_kiosk_page")"
      else
        export KIOSK_URL="$IGconf_kiosk_url"
      fi
      export KIOSK_USER="$IGconf_kiosk_user"
      export KIOSK_RUNDIR_NAME="kiosk"
      # cage runs this script: rotate the output (if asked), wait for the page, then start the browser.
      # Build-time values are filled in here; \$ keeps a variable for run time.
      mkdir -p "$1/usr/local/bin"
      cat > "$1/usr/local/bin/kiosk-session" <<EOF
      #!/bin/sh
      # Generated by the kiosk layer at image build time.
      if [ "$IGconf_kiosk_rotation" != "0" ]; then
        out=\$(wlr-randr | head -n 1 | cut -d' ' -f1)
        wlr-randr --output "\$out" --transform "$IGconf_kiosk_rotation" || echo "kiosk-session: rotation failed" >&2
      fi
      # A web page may be served from this device (eg a container still starting), so
      # wait for it to answer, up to 10 minutes, then open the browser regardless.
      url="$KIOSK_URL"
      case "\$url" in
        http://*|https://*)
          i=0
          while ! curl -s -o /dev/null --max-time 2 "\$url" && [ \$i -lt 300 ]; do
            i=\$((i+1))
            sleep 2
          done
          ;;
      esac
      exec /usr/bin/chromium "\$url" --kiosk --noerrdialogs --disable-infobars --no-first-run --force-dark-mode --enable-features=OverlayScrollbar,WebUIDarkMode --start-maximized --user-data-dir=/run/$KIOSK_RUNDIR_NAME/chromium
      EOF
      chmod 755 "$1/usr/local/bin/kiosk-session"
      # wlr-randr turns the picture, not the touchscreen, so tell libinput how the
      # panel is turned. wlr-randr --transform N turns the picture counter-clockwise by
      # N degrees (confirmed on a real screen), and these matrices match that.
      matrix="${IGconf_kiosk_touch_matrix:-}"
      if [ -z "$matrix" ]; then
        case "$IGconf_kiosk_rotation" in
          90)  matrix="0 -1 1 1 0 0" ;;
          180) matrix="-1 0 1 0 -1 1" ;;
          270) matrix="0 1 0 -1 0 1" ;;
        esac
      fi
      if [ -n "$matrix" ]; then
        install -d "$1/etc/udev/rules.d"
        printf 'ACTION=="add|change", SUBSYSTEM=="input", KERNEL=="event[0-9]*", ENV{ID_INPUT_TOUCHSCREEN}=="1", ENV{LIBINPUT_CALIBRATION_MATRIX}="%s"\n' "$matrix" > "$1/etc/udev/rules.d/99-kiosk-touch.rules"
      fi
      export KIOSK_APP=/usr/local/bin/kiosk-session
      envsubst < ${IGconf_kiosk_assetdir}/kiosk.service.tpl > $1/etc/systemd/system/kiosk.service
    - $BDEBSTRAP_HOOKS/enable-units "$1" kiosk
