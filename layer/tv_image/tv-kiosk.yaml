# METABEGIN
# X-Env-Layer-Name: tv-kiosk
# X-Env-Layer-Version: 2.1.0
# X-Env-Layer-Category: example
# X-Env-Layer-Desc: Example webkiosk layer showing how to define configuration
#  variables, declare packages and create a start up script. We depend on the
#  device-user-admin layer as we want to run the kiosk as the user it creates, and
#  we depend on systemd because we install a systemd service to start the kiosk.
# X-Env-Layer-Requires: device-user-admin,systemd-net-min,systemd-timesyncd
#
# X-Env-VarPrefix: tv_kiosk
#
# X-Env-Var-assetdir: ${DOTD}
# X-Env-Var-assetdir-Required: n
# X-Env-Var-assetdir-Valid: dir
# X-Env-Var-assetdir-Set: y
#
# X-Env-Var-url: https://example.com
# X-Env-Var-url-Desc: What the kiosk loads at startup. Either an https:// URL, or
#  an absolute path to a file inside the image (eg /var/www/html/tv_menu.html),
#  which is opened as file://. No spaces.
# X-Env-Var-url-Required: n
# X-Env-Var-url-Valid: regex:^(https://[a-zA-Z0-9.-]+[a-zA-Z0-9]/?[^ ]*|/[^ ]+)$
# X-Env-Var-url-Set: y
#
# X-Env-Var-user: tv-kiosk
# X-Env-Var-user-Desc: Account the kiosk runs as.
# X-Env-Var-user-Required: n
# X-Env-Var-user-Valid: regex:^[a-z_][a-z0-9_-]*$
# X-Env-Var-user-Set: y
#
# X-Env-Var-rotation: 0
# X-Env-Var-rotation-Desc: Rotate the kiosk display. One of 0, 90, 180 or 270,
#  passed to wlr-randr --transform on the first output before the browser starts.
#  If the picture turns the wrong way, use 270 instead of 90 (or the reverse).
# X-Env-Var-rotation-Required: n
# X-Env-Var-rotation-Valid: regex:^(0|90|180|270)$
# X-Env-Var-rotation-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - cage
    - chromium
    - cec-utils
    - wlr-randr
  customize-hooks:
    - |
      for g in video render input; do
        chroot $1 groupadd -f -r $g
      done
      chroot $1 adduser --disabled-password --gecos "" "$IGconf_tv_kiosk_user"
      for g in video render input; do
        chroot $1 adduser "$IGconf_tv_kiosk_user" $g
      done
    - |
      # A leading / means a file in the image, anything else is a URL
      case "$IGconf_tv_kiosk_url" in
        /*)
          [ -f "$1$IGconf_tv_kiosk_url" ] || echo "WARNING: $IGconf_tv_kiosk_url is not in the image at this point" >&2
          export KIOSK_URL="file://$IGconf_tv_kiosk_url"
          ;;
        *)
          export KIOSK_URL="$IGconf_tv_kiosk_url"
          ;;
      esac
      export KIOSK_USER="$IGconf_tv_kiosk_user"
      export KIOSK_RUNDIR_NAME="kiosk"
      # cage runs this script: rotate the output (if asked), then start the browser.
      # Build-time values are filled in here; \$ keeps a variable for run time.
      mkdir -p "$1/usr/local/bin"
      cat > "$1/usr/local/bin/kiosk-session" <<EOF
      #!/bin/sh
      # Generated by the tv-kiosk layer at image build time.
      if [ "$IGconf_tv_kiosk_rotation" != "0" ]; then
        out=\$(wlr-randr | head -n 1 | cut -d' ' -f1)
        wlr-randr --output "\$out" --transform "$IGconf_tv_kiosk_rotation" || echo "kiosk-session: rotation failed" >&2
      fi
      exec /usr/bin/chromium "$KIOSK_URL" --kiosk --noerrdialogs --disable-infobars --no-first-run --force-dark-mode --enable-features=OverlayScrollbar,WebUIDarkMode --start-maximized --user-data-dir=/run/$KIOSK_RUNDIR_NAME/chromium
      EOF
      chmod 755 "$1/usr/local/bin/kiosk-session"
      export KIOSK_APP=/usr/local/bin/kiosk-session
      envsubst < ${IGconf_tv_kiosk_assetdir}/kiosk.service.tpl > $1/etc/systemd/system/kiosk.service
    - $BDEBSTRAP_HOOKS/enable-units "$1" kiosk
